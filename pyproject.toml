[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-backend"
version = "1.0.0"
description = "CV Sender Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "reportlab==4.2.5",
    "Pillow==10.4.0",
    "pydantic==2.10.4",
    "python-dotenv==1.0.1"
]